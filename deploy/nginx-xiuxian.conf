# 问道长生：放进 nginx 的 server{} 中（install.sh 会自动处理）
location = /xiuxian { return 301 /xiuxian/; }

# 网页（静态文件，直接读取仓库目录）
location /xiuxian/ {
    alias /opt/xiu/web/;
    index index.html;
    add_header Cache-Control "no-cache";
}

# 存档接口 → Python 服务
location /xiuxian/api/ {
    proxy_pass http://127.0.0.1:18300/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 4m;
}
