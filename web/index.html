<body>
<div id="app">
  <!-- 顶部：道号、境界、修为、灵石 -->
  <header id="top">
    <div class="top-line"><b id="p-name"></b><span id="p-realm"></span></div>
    <div class="row small"><span>修为 <b id="p-exp"></b></span><span>灵石 <b id="p-stone"></b><span id="sync"></span></span></div>
    <div class="row small"><span>贡献 <b id="p-contrib"></b></span><span>功德 <b id="p-merit"></b></span></div>
    <div class="bar"><div id="exp-bar"></div></div>
  </header>

  <!-- 中间：当前标签页内容 -->
  <main id="view"></main>

  <!-- 修行日志 -->
  <div id="log-wrap"><div id="log"></div></div>

  <!-- 底部标签 -->
  <nav id="tabs">
    <button data-tab="cultivate" class="active"><i>☯</i>修炼</button>
    <button data-tab="bag"><i>囊</i>背包</button>
    <button data-tab="gongfa"><i>卷</i>功法</button>
    <button data-tab="lingen"><i>根</i>灵根</button>
    <button data-tab="sect"><i>宗</i>门派</button>
    <button data-tab="cave"><i>府</i>洞府</button>
    <button data-tab="world"><i>界</i>世界</button>
  </nav>
</div>

<!-- 浮动提示（非修炼页显示消息） -->
<div id="toast"></div>

<!-- 弹窗 -->
<div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>

<!-- 加载顺序：数据 → 核心 → 模块（模块的 tick 按这里的顺序执行） -->
<!-- 数值设置（改平衡只改这个） -->
<script>
  // 数值文件写错（语法错误）时在页面顶部提示是哪个文件、第几行
  window.addEventListener("error", function (e) {
    if (!e.filename) return;
    var b = document.getElementById("cfg-err") || document.body.insertBefore(Object.assign(document.createElement("div"), { id: "cfg-err" }), document.body.firstChild);
    b.style.cssText = "background:#7a1f1f;color:#fff;padding:8px;font-size:13px;white-space:pre-wrap";
    b.textContent += "脚本错误：" + e.filename.split("/").slice(-2).join("/").split("?")[0] + " 第 " + e.lineno + " 行：" + e.message + "\n";
  });
</script>
